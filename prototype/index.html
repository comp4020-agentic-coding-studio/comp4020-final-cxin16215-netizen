<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Garden prototype</title>
<style>
  @property --c1{syntax:'<color>';inherits:true;initial-value:#999}
  @property --c2{syntax:'<color>';inherits:true;initial-value:#777}
  @property --st{syntax:'<color>';inherits:true;initial-value:#888}
  @property --lf{syntax:'<color>';inherits:true;initial-value:#999}
  @property --leaf{syntax:'<color>';inherits:true;initial-value:#999}
  @property --near{syntax:'<color>';inherits:true;initial-value:#888}
  @property --near-st{syntax:'<color>';inherits:true;initial-value:#777}
  :root{--paper:#f2ece1;--ink:#2f2a26;--ink-soft:#6e665e;--line:rgba(47,42,38,.14);--leaf:#a29d97;--near:#8f8a84;--near-st:#77726c}
  :root.ready{transition:--leaf 2.4s ease,--near 2.4s ease,--near-st 2.4s ease}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;overflow:hidden}
  .layer{position:fixed;inset:0;width:100%;height:100%;display:block}
  #paper{z-index:0}#sky{z-index:1}#daySky{z-index:2}#celestial{z-index:3}#bg{z-index:4}#dayLand{z-index:5}#starry{z-index:6;opacity:0}#fg{z-index:7;cursor:crosshair}
  #near{z-index:8;pointer-events:none}#corner{z-index:9;pointer-events:none}#weather{z-index:10;pointer-events:none}
  #tint{position:fixed;inset:0;z-index:11;pointer-events:none;mix-blend-mode:multiply;background:#fff}
  #night{z-index:12;pointer-events:none;opacity:0}#bolt{z-index:13;pointer-events:none}
  #flash{position:fixed;inset:0;z-index:13;pointer-events:none;background:#f4f6ff;opacity:0}
  #motes{z-index:14;pointer-events:none}
  #daySky,#dayLand{pointer-events:none}
  /* both painted styles follow the presence colours: charcoal until enough people bring their families back */
  #starry,#night,#daySky,#dayLand{filter:grayscale(1);transition:filter 2.4s ease}
  .u-blue #starry,.u-yellow #night,.u-blue #daySky,.u-green #dayLand{filter:none}
  header{position:fixed;z-index:15;top:0;left:0;right:0;display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;padding:16px;font-size:14px;letter-spacing:.06em;color:var(--ink-soft);pointer-events:none;transition:color 1.5s ease,text-shadow 1.5s ease;text-shadow:0 0 3px rgba(242,236,225,.95),0 0 10px rgba(242,236,225,.8)}
  /* a soft halo keeps the header legible over mottled cloud and sky, not only over plain paper */
  .dark header{color:#ece7dc;text-shadow:0 0 3px rgba(22,26,40,.9),0 0 10px rgba(22,26,40,.75)}
  header p{margin:0}
  input[type=checkbox]{accent-color:var(--ink);margin:0}
  #controls{position:fixed;z-index:15;left:16px;right:16px;bottom:16px;margin:0 auto;width:fit-content;max-width:calc(100% - 32px);display:flex;flex-direction:column;gap:10px;padding:12px 18px;background:rgba(242,236,225,.88);border:1px solid var(--line);border-radius:20px;font-size:14px}
  .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 18px}
  .field{display:flex;align-items:center;gap:8px}
  input[type=range]{width:130px;accent-color:var(--ink)}
  select,button{font:inherit;color:inherit;background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 12px;cursor:pointer}
  button:hover,select:hover{border-color:var(--ink-soft)}
  :focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  output,#counts{font-variant-numeric:tabular-nums}
  #counts{color:var(--ink-soft)}
  fieldset{border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  legend{float:left;margin-right:6px;padding:4px 0}
  .chip{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
  .chip input{position:absolute;opacity:0;pointer-events:none}
  .chip:has(input:checked){border-color:var(--ink);background:rgba(47,42,38,.07)}
  .chip:has(input:focus-visible){outline:2px solid var(--ink);outline-offset:2px}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--dot);box-shadow:inset 0 0 0 1px rgba(47,42,38,.22)}
  /* in season: sowing now means it sprouts this year */
  .chip.now::after{content:'';position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:#6fae5a;animation:pulse 2s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(111,174,90,.6)}70%{box-shadow:0 0 0 7px rgba(111,174,90,0)}100%{box-shadow:0 0 0 0 rgba(111,174,90,0)}}
  .hint{color:var(--ink-soft);font-size:12px}
  .fx button{font-size:13px;padding:3px 10px}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  .sow{border-color:var(--ink)}
  #announce{position:fixed;z-index:16;left:50%;bottom:calc(var(--ctl,140px) + 28px);transform:translateX(-50%);margin:0;max-width:calc(100% - 32px);padding:6px 14px;border-radius:999px;background:rgba(47,42,38,.84);color:#f2ece1;font-size:14px;text-align:center;opacity:0;transition:opacity .3s ease;pointer-events:none}
  #announce.show{opacity:1}
  .ready .wash{transition:fill 2.4s ease}
  .ready .fl{transition:--c1 2.4s ease,--c2 2.4s ease,--st 2.4s ease,--lf 2.4s ease}
  .ready stop{transition:stop-color 2.4s ease}
  .ripple{fill:none;stroke:var(--ink);stroke-width:1.2;transform-box:fill-box;transform-origin:center;animation:ripple 1.2s ease-out forwards}
  @keyframes ripple{from{transform:scale(.3);opacity:.8}to{transform:scale(4);opacity:0}}
  @media (prefers-reduced-motion:reduce){.ready .wash,.ready .fl,.ready stop,:root.ready{transition-duration:.6s}.ripple{display:none}.chip.now::after{animation:none}}
</style>
<style id="spcss"></style>
<style id="seasoncss"></style>
</head>
<body>
<svg id="paper" class="layer" aria-hidden="true">
  <filter id="mottle"><feTurbulence type="fractalNoise" baseFrequency=".0045" numOctaves="3" seed="11"/><feColorMatrix values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .30  .5 0 0 0 -.18"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="7"/><feColorMatrix values="0 0 0 0 .32  0 0 0 0 .27  0 0 0 0 .22  .6 0 0 0 -.22"/></filter>
  <rect width="100%" height="100%" filter="url(#mottle)" opacity=".6"/>
  <rect width="100%" height="100%" filter="url(#grain)" opacity=".7"/>
</svg>
<svg id="sky" class="layer" aria-hidden="true"></svg>
<svg id="daySky" class="layer" aria-hidden="true"></svg>
<svg id="celestial" class="layer" aria-hidden="true"></svg>
<svg id="starry" class="layer" aria-hidden="true"></svg>
<svg id="bg" class="layer" aria-hidden="true"></svg>
<svg id="dayLand" class="layer" aria-hidden="true"></svg>
<svg id="fg" class="layer" aria-hidden="true"><defs id="defs"></defs></svg>
<svg id="near" class="layer" aria-hidden="true">
  <defs><filter id="dof" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter></defs>
</svg>
<svg id="corner" class="layer" aria-hidden="true"></svg>
<svg id="weather" class="layer" aria-hidden="true"></svg>
<div id="tint"></div>
<svg id="night" class="layer" aria-hidden="true"></svg>
<svg id="bolt" class="layer" aria-hidden="true"></svg>
<div id="flash"></div>
<svg id="motes" class="layer" aria-hidden="true">
  <defs>
    <radialGradient id="moteGrad"><stop offset="0" stop-color="#7a716a" stop-opacity=".9"/><stop offset="1" stop-color="#7a716a" stop-opacity="0"/></radialGradient>
    <radialGradient id="ffGrad"><stop offset="0" stop-color="#fbffd8" stop-opacity="1"/><stop offset=".35" stop-color="#dff27a" stop-opacity=".8"/><stop offset="1" stop-color="#dff27a" stop-opacity="0"/></radialGradient>
  </defs>
</svg>

<header>
  <p id="status" role="status"></p>
  <p id="clock"></p>
</header>
<p id="announce" aria-live="polite"></p>

<div id="controls">
  <div class="row">
    <div class="field">
      <label for="people">People here</label>
      <input id="people" type="range" min="1" max="5" step="1" value="5">
      <output id="peopleOut" for="people">5</output>
    </div>
    <div class="field">
      <label for="speed">Pace</label>
      <select id="speed"><option value="fast">Demo (fast)</option><option value="slow">Closer to real (slow)</option></select>
    </div>
    <span id="counts"></span>
    <button id="sow" class="sow" type="button">Sow somewhere</button>
  </div>
  <div class="row">
    <fieldset id="picker"><legend>Plant <span class="hint">· dot = sprouts now</span></legend></fieldset>
  </div>
  <div class="row">
    <div class="field">
      <label for="hour">Time of day</label>
      <input id="hour" type="range" min="0" max="23.99" step="0.05" value="9">
      <output id="hourOut" for="hour">09:00</output>
    </div>
    <div class="field">
      <label for="season">Season</label>
      <input id="season" type="range" min="0" max="3.99" step="0.01" value="1.2">
      <output id="seasonOut" for="season">Summer</output>
    </div>
    <label class="field"><input id="auto" type="checkbox" checked>Run the clock</label>
  </div>
  <div class="row fx">
    <span class="hint" title="Each one also happens on its own in its season">Seasonal moments · preview</span>
    <button type="button" data-fx="storm">Summer storm</button>
    <button type="button" data-fx="fireflies">Night fireflies</button>
    <button type="button" data-fx="dragonfly">Autumn dragonflies</button>
    <button type="button" data-fx="butterfly">Spring butterflies</button>
  </div>
</div>

<script>
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const root=document.documentElement,bg=$('bg'),fg=$('fg'),defs=$('defs'),near=$('near'),motesSvg=$('motes');
const daySky=$('daySky'),dayLand=$('dayLand'),celestial=$('celestial'),weather=$('weather'),nightSvg=$('night'),tintEl=$('tint'),skySvg=$('sky'),starry=$('starry'),cornerSvg=$('corner'),boltSvg=$('bolt'),flashEl=$('flash');
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const q=new URLSearchParams(location.search);
const FREEZE=q.has('static');
const STILL=FREEZE||matchMedia('(prefers-reduced-motion: reduce)').matches;

const SEASONS=['spring','summer','autumn','winter'];
const cap=s=>s[0].toUpperCase()+s.slice(1);
// each species' year in season units (0 = start of spring): shoots appear, flowers open, flowers fade, plant gone to seed
const LIFE={tulip:[0,.35,.95,1.4],lily:[.05,.45,1.05,1.5],forget:[0,.3,1.3,1.8],poppy:[.1,.7,1.7,2.2],lavender:[.15,1,2.2,2.8],bell:[.15,1,2,2.6],sunflower:[.3,1.2,2.5,3.1],cosmos:[.35,1.25,2.8,3.3],marigold:[.2,1,2.95,3.45]};
const SEEDHEAD={poppy:'pod',tulip:'pod',lily:'pod',sunflower:'disc',cosmos:'disc',marigold:'disc'};
const BROWN='#8a6a4a',DRY='#9b7a4e';
const smooth=t=>t*t*(3-2*t);
// foliage tone per season: fresh yellow-green, as painted, ochre, winter grey-brown
const FOLIAGE=[['#b9d86e',.3],[null,0],['#c98a32',.6],['#a39a8c',.72]];
// multiply tint over the whole scene through the day: [hour, colour, strength]
const TINT=[[0,'#34467a',.5],[4.5,'#3a4a78',.48],[5.5,'#8a6e8e',.4],[6.3,'#f2a27a',.3],[7.5,'#f7d9b5',.12],[9.5,'#ffffff',0],[16,'#fff1dc',.05],[17.6,'#f5a070',.26],[18.6,'#b0708a',.38],[19.8,'#4a5584',.46],[21,'#34467a',.5],[24,'#34467a',.5]];
let hour=q.has('hour')?+q.get('hour'):9,season=q.has('season')?+q.get('season'):1.2;
let auto=!FREEZE&&!q.has('hour')&&!q.has('season'),night=0;
const lerp=(a,b,t)=>a+(b-a)*t;
// seasons hold steady for most of their span and blend into the next over the last quarter
function seasonMix(){const i=Math.floor(season)%4,t=clamp01((season-Math.floor(season)-.75)/.25);return[i,(i+1)%4,t*t*(3-2*t)]}
function seasonWeight(k){const[i,j,t]=seasonMix();return(i===k?1-t:0)+(j===k?t:0)}
// where a plant is in its year; derived from the season alone so scrubbing the slider backwards replays it correctly
function lifeOf(f){
  const[up,open,fade,gone]=LIFE[f.sp.id],s=(season+f.jit+4)%4;
  // something planted while its kind is dying back waits as a seed until its next growing season comes round
  if(f.wait){if(s>=fade&&s<gone)return{g:0,k:0,seed:true};if(s>=up&&s<fade)f.wait=false}
  if(s<up||s>=gone)return{g:0,k:0,seed:true};
  if(s<open)return{g:.64*smooth((s-up)/(open-up)),k:0,seed:false};
  if(s<fade)return{g:.64+.36*smooth(Math.min(1,(s-open)/.15)),k:0,seed:false};
  return{g:1,k:(s-fade)/(gone-fade),seed:false};
}
const tone=(hex,fam)=>people>=UNLOCK[fam]?hex:grey(hex);
function foliage(hex){const[i,j,t]=seasonMix(),tone=k=>FOLIAGE[k][0]?mix(hex,FOLIAGE[k][0],FOLIAGE[k][1]):hex;return mix(tone(i),tone(j),t)}

const INK='#3a332d',MOTE_GREY='#7a716a';
const UNLOCK={red:2,green:3,blue:4,yellow:5};
const NAMES=[['red','red'],['green','green'],['blue','blue'],['yellow','yellow']];
const BGHUE={sky:['#93b5d4','blue'],sun:['#c4493d','red'],hills:['#6f93b8','blue'],meadow:['#a9c79a','green']};
const SPECIES=[
  {id:'poppy',name:'Poppy',fam:'red',c1:'#cf4a3c',c2:'#2f2a26',st:'#7f9870',lf:'#8aa37c',h:[110,160],lean:18,size:1.1,temp:.85},
  {id:'tulip',name:'Tulip',fam:'red',c1:'#dc6f86',c2:'#a8435c',st:'#6d9a7e',lf:'#7fa98f',h:[70,100],lean:6,size:1.15,temp:.5},
  {id:'cosmos',name:'Cosmos',fam:'red',c1:'#d86aa2',c2:'#d9a93a',st:'#5f9a4c',lf:'#78b05c',h:[110,160],lean:20,size:1,temp:.45},
  {id:'bell',name:'Bellflower',fam:'blue',c1:'#5f7fc8',c2:'#3f5ea8',st:'#5e8c5a',lf:'#6f9d65',h:[80,120],lean:24,size:1.1,temp:0},
  {id:'lavender',name:'Lavender',fam:'blue',c1:'#8c6cc4',c2:'#6a4fa3',st:'#8a9c8e',lf:'#9db0a0',h:[60,90],lean:6,size:1,temp:.1},
  {id:'forget',name:'Forget-me-not',fam:'blue',c1:'#7fb0e0',c2:'#e6c14a',st:'#6a9660',lf:'#7ca86e',h:[35,60],lean:8,size:1.1,temp:.05},
  {id:'sunflower',name:'Sunflower',fam:'yellow',c1:'#eab52f',c2:'#6b4526',st:'#5a7d3c',lf:'#62903f',h:[170,230],lean:10,size:1.25,temp:1},
  {id:'marigold',name:'Marigold',fam:'yellow',c1:'#ea8f36',c2:'#c9621f',st:'#6f9a4a',lf:'#8ab65e',h:[45,70],lean:8,size:1.1,temp:.9},
  {id:'lily',name:'Lily of the valley',fam:'green',c1:'#fdfcf7',c2:'#9fb59a',st:'#6c9a5e',lf:'#5f9460',h:[40,65],lean:14,size:1,temp:.15},
];
const BAND=[664,752];
// border planting: tall species in the back row, short ones at the front, each row laid out in drifts
const ROWS=[
  {y:[664,690],species:['sunflower','cosmos','bell','poppy'],w:[100,180]},
  {y:[688,722],species:['poppy','tulip','lavender','cosmos','bell'],w:[70,140]},
  {y:[718,752],species:['forget','lily','marigold','tulip','lavender'],w:[60,120]},
];
const SKY_HAZE='#c8d3dc';
const ROI={x:200,y:330,w:800,h:440};
const MAX=140,VARIANTS=3,DEG=57.2958;
let opBoost=1;

function mulberry32(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let rand=mulberry32(1);
function gauss(){let u=0,v=0;while(!u)u=rand();while(!v)v=rand();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const clamp01=x=>x<0?0:x>1?1:x;
const easeOut=p=>1-Math.pow(1-p,3);
const easeOutBack=p=>1+2.4*Math.pow(p-1,3)+1.4*Math.pow(p-1,2);
const f1=n=>n.toFixed(1);
const vr=()=>Math.floor(rand()*VARIANTS);
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function grey(hex){const n=parseInt(hex.slice(1),16),L=Math.round(.299*(n>>16)+.587*(n>>8&255)+.114*(n&255));return`rgb(${L+6},${L+3},${L-3})`}
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)),A=p(a),B=p(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}

// Watercolour wash after Tyler Hobbs: deform a polygon, then stack many faint re-deformed copies
function ring(cx,cy,rx,ry,n,rot=0){const c=Math.cos(rot),s=Math.sin(rot),p=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2,x=Math.cos(t)*rx*(.9+rand()*.2),y=Math.sin(t)*ry*(.9+rand()*.2);p.push({x:cx+x*c-y*s,y:cy+x*s+y*c,v:.4+rand()*.9})}return p}
function deform(pts,depth,variance){
  for(let d=0;d<depth;d++){
    const out=[];
    for(let i=0;i<pts.length;i++){
      const a=pts[i],b=pts[(i+1)%pts.length],len=Math.hypot(b.x-a.x,b.y-a.y),v=(a.v+b.v)/2;
      out.push(a,{x:(a.x+b.x)/2+gauss()*len*variance*v,y:(a.y+b.y)/2+gauss()*len*variance*v,v:v*(.75+rand()*.5)});
    }
    pts=out;
  }
  return pts;
}
function toD(p){let d=`M${f1(p[0].x)} ${f1(p[0].y)}`;for(let i=1;i<p.length;i++)d+=`L${f1(p[i].x)} ${f1(p[i].y)}`;return d+'Z'}
function wash(parent,o){
  // vertex spacing follows the shape's thin dimension, so long flat washes don't fold into spikes
  const n=o.n||Math.max(8,Math.round(Math.PI*2*Math.sqrt((o.rx*o.rx+o.ry*o.ry)/2)/(Math.min(o.rx,o.ry)*.6)));
  const base=deform(ring(o.cx,o.cy,o.rx,o.ry,n,o.rot||0),o.baseDepth??1,o.spread??.35);
  for(let i=0;i<o.layers;i++){
    const a={d:toD(deform(base.map(p=>({...p})),o.layerDepth??3,o.layerSpread??.4)),'fill-opacity':o.opacity};
    if(o.style)a.style=o.style;
    el('path',a,parent);
  }
}
function washPoly(g,poly,o){
  const base=deform(poly.map(p=>({...p})),1,o.spread);
  for(let i=0;i<o.layers;i++)el('path',{d:toD(deform(base.map(p=>({...p})),1,o.layerSpread)),'fill-opacity':o.opacity,style:o.style},g);
}
const small=(cx,cy,rx,ry,layers,opacity,v,rot=0)=>({cx,cy,rx,ry,rot,n:6,baseDepth:1,layerDepth:2,spread:.28,layerSpread:.22,layers,opacity:opacity*opBoost,style:`fill:var(${v})`});
function petalRing(g,cx,cy,count,offset,rx,ry,layers,op,v,jit=.15){
  const a0=rand()*Math.PI*2;
  for(let i=0;i<count;i++){const a=a0+i/count*Math.PI*2+(rand()-.5)*jit;wash(g,small(cx+Math.cos(a)*offset,cy+Math.sin(a)*offset,rx,ry,layers,op,v,a))}
}

const HEADS={
  poppy(g){petalRing(g,0,0,4,9,11,10,3,.3,'--c1',.35);wash(g,small(0,0,4,4,2,.75,'--c2'));for(let i=0;i<7;i++){const a=i/7*Math.PI*2;el('circle',{cx:f1(Math.cos(a)*6),cy:f1(Math.sin(a)*6),r:.9,style:'fill:var(--c2)',opacity:.8},g)}},
  tulip(g){wash(g,small(-4.5,-9,6.5,12.5,3,.32,'--c1',-.2));wash(g,small(4.5,-9,6.5,12.5,3,.32,'--c1',.2));wash(g,small(0,-10.5,6,14,3,.3,'--c1'));wash(g,small(0,-3,6,4,2,.3,'--c2'))},
  cosmos(g){petalRing(g,0,0,8,10,9.5,5,3,.3,'--c1');wash(g,small(0,0,3.2,3.2,2,.8,'--c2'))},
  bell1(g){wash(g,small(0,7,4.4,6.5,3,.36,'--c1'));wash(g,small(0,12.5,6,2.2,2,.32,'--c2'));wash(g,small(0,1,2.2,1.6,2,.45,'--lf'))},
  lavender(g){for(let i=0;i<10;i++)wash(g,small((rand()-.5)*3,-i*4.6,2.9-i*.12,3.6,2,.42,i%2?'--c2':'--c1'))},
  forget(g){for(const[fx,fy]of[[-6,-2],[5,-5],[0,5],[7,4]]){petalRing(g,fx,fy,5,2.4,2.2,2,2,.45,'--c1');el('circle',{cx:fx,cy:fy,r:.9,style:'fill:var(--c2)'},g)}},

// the night sky as Van Gogh brushwork: short strokes laid along a flow field of a few swirling vortices
function buildStarry(){
  rand=mulberry32(1889);
  const g=el('g',{fill:'none','stroke-linecap':'round'},starry);
  const V=[[430,420,110,1],[760,470,80,-1],[1030,380,70,1],[170,390,80,-1],[600,-150,220,1]];
  const field=(x,y)=>{
    let fx=1,fy=.18*Math.sin(x/140+y/90);

    const n=Math.hypot(fx,fy);return[fx/n,fy/n];
  };
  const SKY=['#1b2f6b','#223c85','#2c51a3','#3b6bc2','#5a88cf','#86aee0','#c3daf0'];
  el('rect',{x:-600,y:-1200,width:2400,height:2200,fill:'#1e3470'},g);
  // most strokes go where a desktop view actually shows sky; the rest cover the tall phone sky above it
  for(let i=0;i<3200;i++){
    let x=-300+rand()*1800,y=rand()<.75?260+rand()*360:-950+rand()*1210,core=0;
    for(const[vx,vy,r]of V)core=Math.max(core,Math.exp(-((x-vx)**2+(y-vy)**2)/(2*r*r)));
    const ci=Math.min(SKY.length-1,Math.floor(rand()*3+core*4.5)),L=(16+rand()*18)*(1+core*.8),n=7;
    let d=`M${f1(x)} ${f1(y)}`;
    for(let s=0;s<n;s++){const[dx,dy]=field(x,y);x+=dx*L/n;y+=dy*L/n;d+=`L${f1(x)} ${f1(y)}`}
    el('path',{d,stroke:SKY[ci],'stroke-width':(2.4+rand()*2.4).toFixed(1),'stroke-linejoin':'round',opacity:(.65+rand()*.35).toFixed(2)},g);
  }
  const HILL=['#1c3350','#24465e','#2f5a66','#3d6d6e','#1a2c3f'];
  for(let i=0;i<900;i++){
    let x=-400+rand()*2000,y=590+rand()*330;const L=16+rand()*20;let d=`M${f1(x)} ${f1(y)}`;
    for(let s=0;s<4;s++){x+=L/4;y+=Math.sin(x/90+y/40)*2.2;d+=`L${f1(x)} ${f1(y)}`}
    el('path',{d,stroke:HILL[Math.floor(rand()*HILL.length)],'stroke-width':(3+rand()*2.5).toFixed(1),opacity:.8},g);

// By day the backdrop is laid in the way Monet painted a meadow: short loaded dabs of unmixed colour side by side,
// clouds in cream and lilac, distant poppies as single flecks, shadows violet rather than grey. Tens of thousands of

const DAB_K=1.25,SKY_BOX={x:-400,y:-300,w:2000,h:940},LAND_BOX={x:-400,y:540,w:2000,h:400};

}

  const ctx=cv.getContext('2d');ctx.scale(DAB_K,DAB_K);ctx.translate(-box.x,-box.y);ctx.lineCap='round';
  const keep=rand;rand=mulberry32(seed);paint(ctx);rand=keep;
  const img=el('image',{x:box.x,y:box.y,width:box.w,height:box.h,preserveAspectRatio:'none'},svg);
  cv.toBlob(b=>img.setAttribute('href',URL.createObjectURL(b)));

}
// the tops of the watercolour hills, so the dabs lie on the land that is already there

  // broad strokes laid over one another: at this size a sky is a surface of paint, not a scatter of marks
  for(let i=0;i<9000;i++){
    const x=SKY_BOX.x+rand()*SKY_BOX.w,y=SKY_BOX.y+rand()*SKY_BOX.h;
    if(y>hillTop(x)+8)continue;
    const n=cloudN(x,y),cl=.92*smooth(clamp01((n-.56)/.28))*(y<540?1:.6),hz=clamp01((y-430)/170);

      const gx=cloudN(x+4,y)-cloudN(x-4,y),gy=cloudN(x,y+4)-cloudN(x,y-4);ang=Math.atan2(gy,gx)+Math.PI/2+(rand()-.5)*.5;
      col=pick(gy<-.004?MONET_SKY.shade:hz>.3?MONET_SKY.warm:MONET_SKY.cloud);

      ang=-.3+.6*Math.sin(x/300+y/200)+(rand()-.5)*.6;

  {hill:['#95a6d0','#a9b0da','#8fa6c0','#bfc1e0'],green:['#7fae5e','#93bd67','#6d9c56','#b5cf72'],light:['#e8d77a','#f1e3a0'],fleck:['#d9533f','#e0694c','#c94b3a','#8c6cc4'],shadow:['#8d86c2','#7f93bf'],ground:['#b09a78','#c2aa84','#9a90b4']},
  {hill:['#a39ec4','#b3a8c8','#9a9ab8','#c4b8cc'],green:['#b59a52','#c7aa5e','#a08449','#9a9a5a'],light:['#e8c472','#efd08a'],fleck:['#c4632f','#b5462f','#d98a3a','#8a6a9a'],shadow:['#8f7fb0','#7f7aa8'],ground:['#a88a66','#b89868','#8f82a4']},

function paintLand(ctx,k){

let cornerLast=null;

const arc=t=>{const a=Math.PI*t;return[600-Math.cos(a)*560,660-Math.sin(a)*330]};
function updateSky(){
  const ts=(hour-6)/12,tm=((hour-18+24)%24)/12;
  // under storm cloud the sun, moon and stars dim as well as being covered, so none of them glows through the wash
  const hide=1-Math.min(1,stormAmt*2.2)*.9;
  setShown(sunG,ts>-.05&&ts<1.05);
  if(ts>-.05&&ts<1.05){const[x,y]=arc(ts);sunG.setAttribute('transform',`translate(${f1(x)} ${f1(y)})`);sunG.setAttribute('opacity',hide.toFixed(2))}
  setShown(moonG,tm>-.05&&tm<1.05);
  if(tm>-.05&&tm<1.05){const[x,y]=arc(tm);moonG.setAttribute('transform',`translate(${f1(x)} ${f1(y)})`);moonG.setAttribute('opacity',(clamp01((600-y)/120)*hide).toFixed(2))}
  starsG.setAttribute('opacity',hide.toFixed(2));
  let k=0;while(k<TINT.length-2&&hour>=TINT[k+1][0])k++;
  const a=TINT[k],b=TINT[k+1],u=clamp01((hour-a[0])/(b[0]-a[0])),s=lerp(a[2],b[2],u);
  tintEl.style.background=mix(mix('#ffffff',mix(a[1],b[1],u),s),'#6c7686',stormAmt*.5);
  const wasNight=night>.4;
  night=clamp01((s-.28)/.2);
  // opacity on the layer elements themselves so the painted night fades on the compositor, not by repainting
  // a stormy night thins the painted swirls so the clouds beneath them show
  starry.style.opacity=(night*(1-stormAmt*.6)).toFixed(3);
  nightSvg.style.opacity=night.toFixed(3);
  root.classList.toggle('dark',night>.5||stormAmt>.4);
  if(wasNight!==night>.4)applyColors();
}

let drifts=[];
// Jekyll's colour border: cool blues and whites at both ends, warming through pink to hot red, orange and yellow at the centre
const heatAt=x=>clamp01(1-Math.abs(x-600)/400);
function buildDrifts(){
  rand=mulberry32(99);
  drifts=ROWS.map(r=>{
    const out=[];let prev=null;
    for(let x=-250;x<1450;){
      const w=r.w[0]+rand()*(r.w[1]-r.w[0]),T=heatAt(x+w/2);
      const ws=r.species.map(id=>Math.exp(-Math.pow((spById(id).temp-T)/.22,2))*(id===prev?.1:1));
      let k=rand()*ws.reduce((a,b)=>a+b,0),i=0;while(i<ws.length-1&&(k-=ws[i])>0)i++;
      out.push({x0:x,x1:x+w,sp:r.species[i]});prev=r.species[i];x+=w;
    }
    return out;
  });
}
const spById=id=>SPECIES.find(s=>s.id===id);
function rowOf(y){let best=0,bd=1e9;ROWS.forEach((r,i)=>{const d=Math.abs(y-(r.y[0]+r.y[1])/2);if(d<bd){bd=d;best=i}});return best}
function driftSpecies(x,row){
  const ds=drifts[row],k=Math.max(0,ds.findIndex(d=>x>=d.x0&&x<d.x1)),d=ds[k];
  // soften drift edges: close to a boundary, sometimes borrow the neighbouring species
  if(Math.min(x-d.x0,d.x1-x)/(d.x1-d.x0)<.15&&rand()<.35)return spById(ds[x-d.x0<d.x1-x?Math.max(0,k-1):Math.min(ds.length-1,k+1)].sp);

}
// best of a few candidates: keeps plants spaced out instead of piling heads on top of each other
function wildSpot(wide){

function curve(x0,y0,x3,y3,b1,b2){
  const dx=x3-x0,dy=y3-y0,len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;

    at(t){const u=1-t;return[u*u*u*x0+3*u*u*t*c1x+3*u*t*t*c2x+t*t*t*x3,u*u*u*y0+3*u*u*t*c1y+3*u*t*t*c2y+t*t*t*y3]},

  const B=makeBuilder(body,sc,t<.3,SEEDHEAD[sp.id]);
  HABITS[sp.id](B,x,y,sc,h,lean,sc*sp.size*1.4);
  if(mine)el('circle',{cx:f1(x),cy:f1(y+3),r:(3.2*sc).toFixed(1),fill:'none',stroke:INK,'stroke-width':1,opacity:.7},g);
  const f={sp,g,body,seedEl,stems:B.stems,leaves:B.leaves,heads:B.heads,x,y,sc,dir:lean>=0?1:-1,p,rate:.8+rand()*.4,mine,jit:(rand()-.5)*.16,key:'',lastK:0};
  if(fresh&&lifeOf(f).k>0)f.wait=true;
  f.lastK=lifeOf(f).k;
  let before=null;for(const o of flowers)if(o.y>y&&(!before||o.y<before.y))before=o;
  garden.insertBefore(g,before?before.g:null);
  flowers.push(f);
  return f;
}

let people=Math.min(5,Math.max(1,parseInt(q.get('people'))||5));
let speed=q.get('speed')==='slow'?.1:1;
let wilt=people===1?1:0,spawnAcc=0;

function setShown(e,shown){if(shown)e.removeAttribute('visibility');else e.setAttribute('visibility','hidden')}
const wrapDeg=(a,b)=>{let d=b-a;while(d>180)d-=360;while(d<-180)d+=360;return d};
// growth follows the season's timeline but never outruns the plant's vigour, which only company builds up
function drawFlower(f){
  const L=lifeOf(f),p=Math.min(L.g,f.p),k=L.k,w=Math.round(wilt*50)/50;
  const key=`${p.toFixed(3)}|${k.toFixed(3)}|${w}|${L.seed}|${people}|${seasonKey}`;
  if(key===f.key)return;
  f.key=key;
  const dk=k-f.lastK;f.lastK=k;
  const collapse=smooth(clamp01((k-.72)/.28));
  setShown(f.seedEl,L.seed||collapse>.3);
  setShown(f.body,!L.seed);
  if(L.seed)return;
  f.body.setAttribute('opacity',(1-collapse).toFixed(2));
  const lean=f.dir*smooth(clamp01((k-.1)/.6))*16;
  f.body.setAttribute('transform',k>0?`translate(0 ${f1(collapse*5)}) rotate(${lean.toFixed(1)} ${f1(f.x)} ${f1(f.y)})`:'');
  // withering browns the petals first, then the leaves; per-plant overrides of the species colours
  const pk=smooth(clamp01(k/.4)),lk=smooth(clamp01((k-.1)/.5)),sp=f.sp;
  if(k>0){
    const st=f.g.style;
    st.setProperty('--c1',tone(mix(sp.c1,BROWN,pk*.85),sp.fam));
    st.setProperty('--c2',tone(mix(sp.c2,'#5a4232',pk*.7),sp.fam));
    st.setProperty('--st',tone(mix(foliage(sp.st),DRY,lk*.8),'green'));
    st.setProperty('--lf',tone(mix(foliage(sp.lf),DRY,lk*.9),'green'));
    f.inl=true;
  }else if(f.inl){for(const v of['--c1','--c2','--st','--lf'])f.g.style.removeProperty(v);f.inl=false}
  for(const s of f.stems){const q=clamp01((p-s.s0)/(s.s1-s.s0));for(const e of s.els){setShown(e,q>0);if(q>0)e.setAttribute('stroke-dashoffset',(1-q).toFixed(4))}}
  for(const Lf of f.leaves){
    const q=clamp01((p-Lf.at)/.15);setShown(Lf.e,q>0);
    if(q>0){
      const s=easeOut(q)*Lf.s*(1-.25*lk),sy=s*(1-.45*lk),a=+Lf.a+wrapDeg(+Lf.a,90)*lk*.45;
      Lf.e.setAttribute('transform',`translate(${Lf.x} ${Lf.y}) rotate(${a.toFixed(1)}) scale(${s.toFixed(3)} ${(Lf.flip?-sy:sy).toFixed(3)})`);
    }
  }
  const shed=smooth(clamp01((k-.28)/.42)),droop=smooth(clamp01((k-.15)/.5));
  for(const H of f.heads){
    const bp=clamp01((p-H.hb)/.28),r=(H.rot+(1-bp)*H.nod+w*18*f.dir+f.dir*droop*65).toFixed(1);
    if(H.bud){const b=clamp01((p-(H.hb-.12))/.1)*(1-bp);setShown(H.bud,b>.01);if(b>.01)H.bud.setAttribute('transform',`translate(${H.x} ${H.y}) rotate(${r}) scale(${(b*H.s*.8).toFixed(3)})`)}
    const hs=(H.budless?easeOut(bp):easeOutBack(bp))*H.s*(1-(H.pod?.85:.55)*shed);
    setShown(H.e,bp>0&&hs>.02);
    if(bp>0&&hs>.02)H.e.setAttribute('transform',`translate(${H.x} ${H.y}) rotate(${r}) scale(${hs.toFixed(3)})`);
    if(H.pod){const ps=smooth(clamp01((k-.35)/.3))*bp;setShown(H.pod,ps>.02);if(ps>.02)H.pod.setAttribute('transform',`translate(${H.x} ${H.y}) rotate(${r}) scale(${(ps*H.s*.75).toFixed(3)})`)}
    // petals come loose while the flower fades, about five per head, in step with the season moving on
    if(dk>0&&dk<.2&&bp>.5&&k>.25&&k<.75){H.acc+=dk/.5*5;while(H.acc>=1){H.acc--;emit(H.wx,H.wy,tone(mix(sp.c1,BROWN,pk*.7),sp.fam),'petal')}}
  }
  if(dk>0&&dk<.2&&k>.55&&k<.85&&f.leaves.length){
    f.lacc=(f.lacc||0)+dk/.3*1.5;
    while(f.lacc>=1){f.lacc--;const Lf=f.leaves[Math.floor(Math.random()*f.leaves.length)];emit(+Lf.x,+Lf.y,tone(mix(foliage(sp.lf),DRY,.8),'green'),'leaf')}
  }
}

function applyColors(){
  for(const k in UNLOCK)root.classList.toggle(`u-${k}`,people>=UNLOCK[k]);
  const green=people>=UNLOCK.green;
  for(const[v,c]of[['--leaf','#7fae84'],['--near','#44704a'],['--near-st','#355a3b']])root.style.setProperty(v,green?foliage(c):grey(c));
  for(const e of document.querySelectorAll('[data-c]')){const c=e.dataset.c;e.style.fill=people>=UNLOCK[e.dataset.fam]?c:grey(c)}
  // at night the presence motes turn into fireflies, whatever colours have come back
  const mc=people>=5?'#e6b43c':night>.4?'#f3e6b0':MOTE_GREY;
  for(const s of motesSvg.querySelectorAll('#moteGrad stop'))s.style.stopColor=mc;
  const ff=motesSvg.querySelectorAll('#ffGrad stop');
  ff[1].style.stopColor=ff[2].style.stopColor=tone('#dff27a','yellow');
}

function statusText(){
  const back=NAMES.filter(n=>people>=UNLOCK[n[1]]).map(n=>n[0]);
  const s=people===1?'just you, so the garden is waiting':(flowers.length>=MAX?'the garden is full':'the garden is growing');
  return`${people} ${people===1?'person':'people'} here · ${s} · ${back.length?'colours back: '+back.join(', '):'no colours back yet'}`;
}

function svgPoint(e){const pt=new DOMPoint(e.clientX,e.clientY).matrixTransform(fg.getScreenCTM().inverse());return[pt.x,pt.y]}
function chosen(x,y){const v=document.querySelector('input[name=species]:checked').value;return v==='random'?driftSpecies(x,rowOf(y)):spById(v)}
function say(text){const a=$('announce');a.textContent=text;a.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>a.classList.remove('show'),2400)}
// a visitor's sowing always wins: in a full garden it takes the place of the nearest wild flower
function sow(x,y){
  let replaced=false;
  if(flowers.length>=MAX){
    let nearest=null,bd=1e9;
    for(const f of flowers)if(!f.mine){const d=Math.hypot(f.x-x,(f.y-y)*2.5);if(d<bd){bd=d;nearest=f}}
    if(!nearest){say('Every spot holds a flower someone planted. There is no room left');return}
    nearest.g.remove();flowers.splice(flowers.indexOf(nearest),1);replaced=true;
  }
  rand=mulberry32(Math.random()*2**32>>>0);
  const sp=chosen(x,y),f=addFlower(sp,x,y,.12,true,true);
  drawFlower(f);
  if(!STILL){const r=el('circle',{cx:f1(x),cy:f1(y),r:6,class:'ripple'},ripples);setTimeout(()=>r.remove(),1300)}
  const seed=lifeOf(f).seed;
  say(`You planted a ${sp.name.toLowerCase()}${seed?' seed':''}${replaced?' in place of a wildflower':''}${seed?`. It won't sprout until ${SEASONS[Math.floor(LIFE[sp.id][0])]}`:''}`);
}
fg.addEventListener('click',e=>{let[x,y]=svgPoint(e);if(y<BAND[0]-10||y>BAND[1]+20)y=BAND[0]+Math.random()*(BAND[1]-BAND[0]);sow(x,Math.min(BAND[1],Math.max(BAND[0],y)))});
$('sow').addEventListener('click',()=>{rand=Math.random;const[x,y]=wildSpot(false);sow(x,y)});

const chips={};
function buildPicker(){
  const fs=$('picker');
  const add=(value,name,color,checked)=>{const l=document.createElement('label');l.className='chip';l.innerHTML=`<input type="radio" name="species" value="${value}"${checked?' checked':''}>${color?`<span class="dot" style="--dot:${color}"></span>`:''}${name}<span class="sr-only"></span>`;fs.appendChild(l);chips[value]=l};
  add('random','Any',null,true);
  for(const sp of SPECIES)add(sp.id,sp.name,sp.c1,false);
}
// a species is in season from when its shoots come up until its flowers fade; sown outside that it waits as a seed
function updatePicker(){
  for(const sp of SPECIES){
    const[up,,fade]=LIFE[sp.id],now=season>=up&&season<fade,l=chips[sp.id];
    l.classList.toggle('now',now);
    l.title=now?'Sprouts if sown now':'Sown now, it waits as a seed until spring';
    l.querySelector('.sr-only').textContent=now?' (in season)':'';
  }
}

function fitView(){
  const w=innerWidth,h=innerHeight,ch=$('controls').offsetHeight+28,top=48;
  root.style.setProperty('--ctl',`${$('controls').offsetHeight}px`);
  const s=Math.min(w/ROI.w,Math.max(120,h-ch-top)/ROI.h);
  const vw=w/s,vh=h/s,vx=ROI.x+ROI.w/2-vw/2,vy=ROI.y+ROI.h-(h-ch)/s;
  const vb=`${f1(vx)} ${f1(vy)} ${f1(vw)} ${f1(vh)}`;
  for(const e of[skySvg,daySky,celestial,starry,bg,dayLand,fg,near,cornerSvg,weather,nightSvg,motesSvg])e.setAttribute('viewBox',vb);
  nearL.setAttribute('transform',`translate(${f1(vx)} 0)`);
  nearR.setAttribute('transform',`translate(${f1(vx+vw)} 0)`);
  cypressG.setAttribute('transform',`translate(${f1(vx)} 0)`);
  cornerG.setAttribute('transform',`translate(${f1(vx+vw)} ${f1(vy)})`);
  VX=vx;VY=vy;VW=vw;VH=vh;
}

let last=performance.now(),lastDraw=0,lastUi=-1e9,lastStatus='',lastCounts='';
function frame(now){
  const dt=Math.min(.1,(now-last)/1000);last=now;
  if(!FREEZE){
    if(people>=2){
      const rate=speed*(people-1)/25;
      for(const f of flowers)if(f.p<1)f.p=Math.min(1,f.p+rate*f.rate*dt);
      spawnAcc+=speed*(people-1)*.3*dt;
      while(spawnAcc>=1){spawnAcc--;if(flowers.length<MAX){rand=Math.random;const[x,y,sp]=wildSpot(true);addFlower(sp,x,y,0,false,true)}}
    }
    wilt+=((people===1?1:0)-wilt)*Math.min(1,dt*.8);
    // demo clock: a day per minute, a season every two minutes
    if(auto){hour=(hour+dt*24/60)%24;season=(season+dt/120)%4}
  }
  updateSky();
  updateDay();
  updateSeason();
  updateCorner();
  updateWeather(dt,now/1000);
  updateFallers(dt,now/1000);
  updateStorm(dt);
  updateFireflies(dt,now/1000);
  updateCritters(dt,now/1000);
  if(now-lastDraw>60){lastDraw=now;for(const f of flowers)drawFlower(f)}
  if(now-lastUi>200){
    lastUi=now;
    const hh=Math.floor(hour),mm=Math.floor((hour-hh)*60),sn=SEASONS[Math.floor(season)%4];
    if(auto){$('hour').value=hour.toFixed(2);$('season').value=season.toFixed(2)}
    $('hourOut').textContent=`${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
    $('seasonOut').textContent=cap(sn);
    $('clock').textContent=`${cap(sn)} · ${timeName(hour)} · visual prototype`;
  }
  const mt=STILL?8:now/1000;
  motes.forEach((m,i)=>{
    const target=i<people?1:0;
    m.o=STILL?target:m.o+(target-m.o)*Math.min(1,dt*1.5);
    m.e.setAttribute('cx',f1(600+Math.sin(mt*.1*(i+1)+m.ph)*280));
    m.e.setAttribute('cy',f1(470+Math.cos(mt*.09*(i+1)+m.ph*1.3)*140));
    m.e.setAttribute('opacity',(m.o*.85).toFixed(3));
  });
  const s=statusText();if(s!==lastStatus){lastStatus=s;$('status').textContent=s}
  const mine=flowers.filter(f=>f.mine).length,c=`${flowers.length} plants${mine?` · you planted ${mine}`:''}`;
  if(c!==lastCounts){lastCounts=c;$('counts').textContent=c}
  requestAnimationFrame(frame);
}

buildPicker();
buildSymbols();
buildBackground();
buildSky();
buildStarry();
buildMonet();
buildNear();
buildCorner();
buildWeather();
buildFx();
buildDrifts();
rand=mulberry32(parseInt(q.get('seed'))||7);
const only=spById(q.get('only'));
const preset=q.has('n')?Math.min(MAX,+q.get('n')):95;
const presetG=q.has('g')?clamp01(+q.get('g')):null;
for(let i=0;i<preset;i++){const[x,y,sp]=wildSpot(true);addFlower(only||sp,x,y,presetG??.55+rand()*.45,false)}
$('people').value=people;$('peopleOut').textContent=people;
if(speed<1)$('speed').value='slow';
$('people').addEventListener('input',e=>{people=+e.target.value;$('peopleOut').textContent=people;applyColors()});
$('speed').addEventListener('change',e=>{speed=e.target.value==='slow'?.1:1});
const stopAuto=()=>{auto=false;$('auto').checked=false};
$('hour').addEventListener('input',e=>{stopAuto();hour=+e.target.value;lastUi=-1e9});
$('season').addEventListener('input',e=>{stopAuto();season=+e.target.value;lastUi=-1e9});
$('auto').addEventListener('change',e=>{auto=e.target.checked&&!FREEZE});
$('hour').value=hour;$('season').value=season;$('auto').checked=auto;
const FX={
  storm(){startStorm();say('A summer storm is rolling in')},
  fireflies(){if(night<.5){hour=21.5;$('hour').value=hour}flyForce=40;say('The fireflies are out')},
  dragonfly(){spawnDragonfly();setTimeout(spawnDragonfly,900);say('Dragonflies skim the garden')},
  butterfly(){for(let i=0;i<3;i++)setTimeout(spawnButterfly,i*600);say('Butterflies drop by')},
};
for(const b of document.querySelectorAll('[data-fx]'))b.addEventListener('click',()=>FX[b.dataset.fx]());
if(FX[q.get('fx')])setTimeout(FX[q.get('fx')],300);
addEventListener('resize',fitView);
updateSeason();
updateSky();
updateDay();
fitView();
updateCorner();
updateWeather(0,0);
for(const f of flowers)drawFlower(f);
requestAnimationFrame(()=>requestAnimationFrame(t=>{root.classList.add('ready');last=t;frame(t)}));
</script>
</body>
